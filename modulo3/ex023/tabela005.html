<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
            border-collapse: collapse;
        }
        caption{
            font-weight: bolder;
        }
        td,th{
            border: 1px solid black;
            padding: 10px;
        }
        col.cnome{
            background-color: greenyellow;
        }

    </style>

</head>
<body>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>

        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana maria</td>
            <td>F</td>
            <td>26</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Cláudio</td>
            <td>M</td>
            <td>28</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Gustavo</td>
            <td>M</td>
            <td>42</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td>Hélio</td>
            <td>M</td>
            <td>45</td>
            <td>Agricultor</td>
        </tr>
        <tr>
            <td>Raíssa</td>
            <td>F</td>
            <td>23</td>
            <td>Frentista</td>
        </tr>
        <tr>
            <td>Elizabeth</td>
            <td>F</td>
            <td>85</td>
            <td>Rainha da Inglaterra</td>
        </tr>
    </table>
    
</body>
</html>
